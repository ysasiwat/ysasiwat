name: Profile metrics

on:
  schedule:
    # Monday and Thursday at 08:17 Asia/Bangkok (01:17 UTC)
    - cron: "17 1 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'ysasiwat/ysasiwat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate contribution and language metrics
        # lowlighter/metrics v3.34, pinned for reproducible and reviewable builds.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ysasiwat
          template: classic
          base: ""
          config_display: large
          config_order: isocalendar, languages
          config_timezone: Asia/Bangkok
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: >-
            html, css, scss, less, tex, shell, dockerfile, makefile, cmake
