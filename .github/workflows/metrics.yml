name: Profile metrics

on:
  schedule:
    # Monday and Thursday at 08:17 Asia/Bangkok (01:17 UTC)
    - cron: "17 1 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'ysasiwat/ysasiwat'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate account overview metrics
        # lowlighter/metrics v3.34, pinned for reproducible and reviewable builds.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ysasiwat
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: columns
          config_order: base.header, base.activity+community, base.repositories
          config_timezone: Asia/Bangkok
