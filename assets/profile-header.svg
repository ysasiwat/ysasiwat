<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Yoschanin Sasiwat</title>
  <desc id="description">Space technology, AI systems, and engineering automation</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1d35"/>
      <stop offset="1" stop-color="#102b4c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93c5fd" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1020" cy="145" r="245" fill="url(#glow)"/>

    <path d="M 820 228 C 904 91, 1051 42, 1184 105" fill="none" stroke="#7dd3fc" stroke-opacity="0.2" stroke-width="1.5"/>
    <path d="M 786 261 C 900 96, 1057 75, 1217 151" fill="none" stroke="#818cf8" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M 902 267 C 965 166, 1055 120, 1197 131" fill="none" stroke="#e0f2fe" stroke-opacity="0.14" stroke-width="1"/>

    <circle cx="1014" cy="151" r="54" fill="none" stroke="#7dd3fc" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="1014" cy="151" r="37" fill="#0b1d35" stroke="#e0f2fe" stroke-opacity="0.26"/>
    <path d="M 980 145 C 1001 128, 1028 127, 1050 143 M 983 164 C 1006 177, 1031 176, 1046 162" fill="none" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M 1006 115 C 995 136, 995 166, 1007 187 M 1023 115 C 1034 138, 1034 165, 1022 187" fill="none" stroke="#818cf8" stroke-opacity="0.65" stroke-width="1.5"/>

    <g fill="#e0f2fe">
      <circle cx="820" cy="228" r="4"/>
      <circle cx="902" cy="88" r="3"/>
      <circle cx="1123" cy="77" r="4"/>
      <circle cx="1164" cy="204" r="3"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="786" cy="261" r="2.5"/>
      <circle cx="1108" cy="118" r="2.5"/>
      <circle cx="931" cy="230" r="2.5"/>
    </g>

    <rect x="64" y="61" width="58" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="125" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1.8">YOSCHANIN SASIWAT</text>
    <text x="66" y="165" fill="#7dd3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.1">SPACE TECHNOLOGY  ·  AI SYSTEMS  ·  ENGINEERING AUTOMATION</text>
    <text x="66" y="207" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Building dependable tools for complex engineering work.</text>
    <text x="66" y="245" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">GISTDA  ·  CHONBURI, THAILAND</text>
  </g>
</svg>
